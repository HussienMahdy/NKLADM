<style>

:root[data-theme=dark]{--bg:#101613;--card:#18211c;--ink:#e8eee9;--mut:#9db0a3;--line:#2a372f;--soft:#202c25;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
a{color:var(--g);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
header{background:linear-gradient(120deg,var(--gd),var(--g) 70%,#2c9a63);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .lg{background:#fff;border-radius:50%;padding:3px;width:82px;height:82px;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(200,162,74,.9)}
header .lg img{width:74px;height:74px;object-fit:contain;display:block;border-radius:50%}
header h1{margin:0;font-size:22px;font-weight:800}header p{margin:2px 0 0;opacity:.92;font-size:12.5px}
header .sp{flex:1}
.dsg{background:rgba(255,255,255,.12);border:1.5px solid var(--gold);border-radius:12px;padding:5px 16px;text-align:center;line-height:1.5}.dsg small{display:block;font-size:11px;opacity:.9}.dsg b{color:#ffe08a;font-size:14.5px}
.flag{height:5px;background:linear-gradient(90deg,var(--r) 33.3%,#fff 33.3% 66.6%,var(--k) 66.6%)}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:var(--sh)}
nav .in{max-width:1300px;margin:0 auto;padding:6px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav a{padding:8px 16px;border-radius:10px;color:var(--ink);display:inline-flex;gap:7px;align-items:center;font-weight:700}
nav a:hover{background:var(--soft);text-decoration:none}nav a.on{background:var(--g);color:#fff}
nav .sp{flex:1}
main{max-width:1300px;margin:0 auto;padding:16px}
.btn{font:inherit;font-weight:600;padding:7px 14px;border-radius:9px;border:1px solid var(--gd);background:linear-gradient(var(--g),var(--gd));color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:transparent;color:var(--g);border-color:var(--g)}.btn.o:hover{background:var(--soft)}
.btn.d{background:var(--r);border-color:var(--r);color:#fff}.btn.o.d{background:transparent;color:var(--r)}
.btn:disabled{opacity:.4;cursor:default}.btn.s{padding:4px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:11px 13px;display:flex;gap:11px;align-items:center;border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--c)}
.kpi[data-k]{cursor:pointer}.kpi.act{outline:2px solid var(--c)}
.kpi i{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.kpi b{font-size:21px;display:block;line-height:1.2}.kpi span{color:var(--mut);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:-1px}
input[type=checkbox]{width:auto;accent-color:var(--g);width:16px;height:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px;flex-wrap:wrap}.bar>span{display:flex;gap:6px;flex-wrap:wrap}
.bulk{background:var(--soft);border:1.5px dashed var(--g);border-radius:12px;padding:8px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{background:linear-gradient(var(--g),var(--gd));color:#fff;padding:10px 8px;text-align:right;white-space:nowrap;font-weight:700}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td small{display:block;color:var(--mut);font-size:11.5px}
tbody tr:nth-child(even){background:var(--soft)}tbody tr[data-id]{cursor:pointer}tbody tr:hover{outline:2px solid var(--g);outline-offset:-2px}
tr.sel{background:rgba(31,122,77,.18)!important}
.ck{width:34px;text-align:center}
.tag{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;color:#fff;background:var(--c,#777);white-space:nowrap}
.g{--c:var(--g)}.b{--c:var(--b)}.y{--c:#b8901f}.r{--c:var(--r)}.x{--c:#777}
.ph{width:112px;height:140px;border:2px solid var(--gold);border-radius:10px;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center;flex:none}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.top h2{margin:0}.top p{color:var(--mut);margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.sec h3{margin:0 0 8px;color:var(--gd);border-bottom:3px solid var(--gold);padding-bottom:5px;font-size:15px}
:root[data-theme=dark] .sec h3{color:#7ad3a1}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.row span{color:var(--mut)}.row b{text-align:left}
.empty{text-align:center;color:var(--mut);padding:26px}
.foot{text-align:center;font-size:13px;padding:14px;background:var(--card);border-top:3px solid var(--gold);margin-top:20px}.foot b{color:var(--g)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:10px}.md{background:var(--card);border-radius:16px;width:min(920px,100%);max-height:94vh;overflow:auto;padding:18px}
.md h3{margin-top:0}
.err{color:var(--r);min-height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 12px;cursor:pointer;font-weight:600}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.bars .r2{display:grid;grid-template-columns:150px 1fr 36px;gap:8px;align-items:center;margin:3px 0;font-size:13px}.bars .t{background:var(--soft);border-radius:6px;height:12px;overflow:hidden}.bars .t i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--gold))}
.rc{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.rc .panel{margin:0;display:flex;flex-direction:column;gap:9px}.rc h3{margin:0;color:var(--gd);font-size:16px}:root[data-theme=dark] .rc h3{color:#7ad3a1}.rc p{margin:0;color:var(--mut);font-size:12.5px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast button{background:#ffe08a;border:0;border-radius:8px;padding:3px 10px;font:inherit;font-weight:700;cursor:pointer}
/* ===== التقارير والطباعة ===== */
#pa{display:none;position:fixed;inset:0;background:#5b6660;overflow:auto;z-index:50;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:Cairo,Tahoma,Arial,sans-serif}
.ptool{position:sticky;top:0;z-index:2;background:#fff;color:#222;padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ptool select{width:auto}.ptool label{display:flex;gap:5px;align-items:center;margin:0;color:#222;font-size:13px}
.ptool details{position:relative}.ptool summary{cursor:pointer;font-weight:700}.ptool details>div{position:absolute;top:28px;right:0;background:#fff;border:1px solid #ccc;border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;min-width:300px;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#pages{padding:14px 0;zoom:var(--z,1);display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{width:194mm;height:281mm;background:#fff;color:#111;border:3px double #0f4c32;padding:5mm 6mm;position:relative;display:flex;flex-direction:column;overflow:hidden;font-size:11px;box-shadow:0 4px 20px rgba(0,0,0,.4);flex:none}
.pg.L{width:281mm;height:194mm}
.pg::before{content:"";position:absolute;inset:0;background:var(--logo) center/42% no-repeat;opacity:.06;pointer-events:none}
.pg>*{position:relative}
.rh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.rh .a b{display:block;font-size:11.5px;line-height:1.55;color:#0f4c32}.rh .c img{height:24mm;display:block}.rh .d{font-size:11px;line-height:1.7;text-align:left;color:#333}
.str{height:4px;background:linear-gradient(90deg,#c8102e 33.3%,#fff 33.3% 66.6%,#111 66.6%);border:1px solid #bbb;margin:4px 0}
.rt{text-align:center;background:linear-gradient(90deg,#0f4c32,#1f7a4d,#0f4c32);color:#fff;padding:3px;margin:4px 0;font-size:17px;font-weight:800;border-radius:6px;border-bottom:3px solid #c8a24a}
.sb{text-align:center;font-size:12px;color:#333;margin-bottom:4px;font-weight:600}
.mh{display:flex;align-items:center;gap:8px;border-bottom:2px solid #0f4c32;padding-bottom:3px;margin-bottom:4px;font-size:11.5px;color:#0f4c32}.mh img{height:9mm}.mh span{margin-inline-start:auto;color:#555}
.ar{flex:1;min-height:0;overflow:hidden}
.ss{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}.ss div{flex:1;min-width:20mm;border:1.2px solid #c8a24a;background:#fdf8e6;border-radius:6px;text-align:center;padding:1px 4px;line-height:1.35}.ss b{display:block;font-size:14px;color:#0f4c32}.ss span{font-size:10px;color:#444}
.rtb{width:100%;border-collapse:collapse;margin-bottom:5px;font-size:10.5px;background:transparent}
.rtb th{background:#e6f1e9;color:#0f4c32;border:1px solid #7a9a85;padding:2px 4px;font-size:10.5px}
.rtb td{border:1px solid #9bb3a3;padding:1px 4px;height:6.4mm;background:transparent}
.rtb tbody tr:nth-child(even){background:#f4f9f5}
.rtb.z thead th{background:#0f4c32;color:#fff}
.rtb td.l{background:#eef5ee;font-weight:700;width:24mm;color:#0f4c32}.rtb td.nm{font-weight:700}.rtb td.sgc{min-width:26mm}
.rtb tr.gh td{background:#dfeee4;font-weight:800;color:#0f4c32;height:6mm}
.rtb .cl{min-height:9mm;white-space:pre-wrap}
.rtb.f th{text-align:center;font-size:12px}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10mm;margin-top:4mm;text-align:center;font-size:12px}
.sg b{display:block;color:#0f4c32;font-size:13px;border-bottom:1.5px solid #c8a24a;padding-bottom:2px;margin-bottom:3px}.sg span{display:block;min-height:5mm;font-weight:700}.sg i{display:block;font-style:normal;margin-top:7mm;color:#444}
.sg .stp{border:1.5px dashed #aaa;border-radius:50%;width:24mm;height:24mm;margin:0 auto;display:grid;place-items:center;color:#999;font-size:11px}
.pf{display:flex;justify-content:space-between;font-size:10px;color:#444;border-top:1.5px solid #c8a24a;margin-top:3mm;padding-top:2px}.pf b{color:#0f4c32}
.rb{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}.rb>div:first-child{flex:1}.rn{font-size:18px;font-weight:800;color:#0f4c32;margin:0}.rj{color:#444;margin:0 0 5px;font-size:12px}
.rp{width:30mm;height:38mm;border:1.5px solid #c8a24a;object-fit:cover;display:grid;place-items:center;font-size:11px;color:#888;text-align:center;background:#fafafa;flex:none}
#pages .fit{transform-origin:top right}
@media print{
 html,body{background:#fff!important;overflow:visible!important;height:auto!important}
 body>*:not(#pa){display:none!important}
 #pa{position:static!important;display:block!important;background:none;overflow:visible}
 .ptool{display:none!important}
 #pages{zoom:1!important;display:block;padding:0}
 .pg{margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
 .pg:last-child{break-after:auto;page-break-after:auto}
}
@media (max-width:640px){header h1{font-size:17px}.dsg{display:none}main{padding:10px}}
</style>

 +RT('البيانات الوظيفية',[['المدرسة / جهة العمل',r.place,'المرحلة',r._s],['الفئة الوظيفية',r.cat,'الوظيفة',r.job],['التخصص على الكادر',r.spec,'مادة التدريس',r.subj],['الوضع الوظيفي',r.status,'حالة التعيين',r.hstat],['تاريخ التعيين',r.hdate,'سنة بلوغ 60',r.ret]])
 +RT('المؤهل',[['المؤهل',r.qual,'نوع المؤهل',r.qtype]])+RT('الإجازات والجزاءات والملاحظات',[['الإجازات',r.leaves],['الجزاءات',r.penalties],['ملاحظات',r.notes]])}}}
const headH=c=>`<div class="rh"><div class="a"><b>جمهورية مصر العربية</b><b>محافظة شمال سيناء</b><b>مديرية التربية والتعليم</b><b>إدارة نخل التعليمية</b><b>شئون العاملين — الموارد البشرية</b></div><div class="c"><img src="${LOGO}"></div><div class="d">التاريخ: <b>${LD()}</b><br>${c.meta||''}</div></div><div class="str"></div><div class="rt">${esc(c.title)}</div>${c.sub?`<div class="sb">${c.sub.includes('<')?c.sub:esc(c.sub)}</div>`:''}`;
const miniH=c=>`<div class="mh"><img src="${LOGO}"><b>إدارة نخل التعليمية — ${esc(c.title)}</b><span>${LD()}</span></div>`;
const sigH=()=>`<div class="sg"><div><b>مسئول الموارد البشرية</b><span>${esc(meta.hr)}</span><i>التوقيع: ..............................</i></div><div><div class="stp">ختم الإدارة</div></div><div><b>مدير عام الإدارة</b><span>${esc(meta.gm)}</span><i>التوقيع: ..............................</i></div></div>`;
let CUR=null;
function openReport(build){CUR=build;$('pa').style.display='block';document.body.style.overflow='hidden';$('pPrint').innerHTML=ic('print')+' طباعة';$('pClose').innerHTML=ic('x')+' إغلاق';
 $('pOr').value=meta.orient;$('pRep').checked=!!meta.rep;$('pCols').innerHTML=Object.keys(COLS).map(k=>`<label><input type="checkbox" value="${k}"${meta.cols.includes(k)?' checked':''}> ${COLS[k][0]}</label>`).join('');renderRep()}
function renderRep(){const o={cols:meta.cols,orient:meta.orient,rep:meta.rep},cfg=CUR(o);$('pColsW').style.display=cfg.noCols?'none':'';$('ps').textContent='@page{size:A4 '+(meta.orient==='landscape'?'landscape':'portrait')+';margin:8mm}';paginate(cfg,o)}
function paginate(cfg,o){const host=$('pages'),L=o.orient==='landscape',pages=[];host.style.setProperty('--z',1);host.style.setProperty('--logo','url('+LOGO+')');host.innerHTML='';
 const ov=pg=>{const a=pg.querySelector('.ar');return a.scrollHeight>a.clientHeight+1};
 const mk=()=>{const first=!pages.length,pg=document.createElement('div');pg.className='pg'+(L?' L':'');
  pg.innerHTML=(first?headH(cfg):miniH(cfg))+`<div class="ar">${first&&cfg.pre?cfg.pre:''}${cfg.body?`<div class="fit">${cfg.body}</div>`:`<table class="rtb z"><thead>${cfg.thead}</thead><tbody></tbody></table>`}</div>${o.rep?sigH():''}<div class="pf"><span>تصميم وتطوير <b>أ.حسين المهدي عبدالحميد هلال</b> — منظومة شئون العاملين بإدارة نخل التعليمية</span><span class="pn"></span></div>`;
  host.appendChild(pg);pages.push(pg);return pg};
 let pg=mk();const mkSig=()=>{const d=document.createElement('div');d.innerHTML=sigH();return d.firstChild};
 if(cfg.body){const a=pg.querySelector('.ar'),f=a.querySelector('.fit');if(!o.rep)pg.insertBefore(mkSig(),pg.querySelector('.pf'));let z=1;while(ov(pg)&&z>.4){z-=.03;f.style.zoom=z}}
 else{let tb=pg.querySelector('tbody');
  if(!cfg.rowsHtml.length)tb.innerHTML='<tr><td colspan="30" style="text-align:center;padding:8mm">لا توجد بيانات</td></tr>';
  for(const h of cfg.rowsHtml){tb.insertAdjacentHTML('beforeend',h);if(ov(pg)&&tb.rows.length>1){const last=tb.lastElementChild,prev=tb;last.remove();pg=mk();tb=pg.querySelector('tbody');if(prev.lastElementChild&&prev.lastElementChild.classList.contains('gh'))tb.appendChild(prev.lastElementChild);tb.appendChild(last)}}
  if(!o.rep){const s=mkSig();pg.insertBefore(s,pg.querySelector('.pf'));if(ov(pg)&&tb.rows.length>2){s.remove();const mv=[];for(let i=0;i<Math.min(4,tb.rows.length-1);i++)mv.unshift(tb.lastElementChild),tb.lastElementChild.remove();pg=mk();tb=pg.querySelector('tbody');mv.forEach(x=>tb.appendChild(x));pg.insertBefore(mkSig(),pg.querySelector('.pf'))}}}
 pages.forEach((p,i)=>p.querySelector('.pn').textContent='صفحة '+(i+1)+' من '+pages.length);
 const w=pages[0].offsetWidth;host.style.setProperty('--z',Math.min(1,(innerWidth-20)/w).toFixed(3))}
function closeRep(){$('pa').style.display='none';document.body.style.overflow='';$('pages').innerHTML=''}
$('pPrint').onclick=()=>print();$('pClose').onclick=closeRep;
$('pOr').onchange=e=>{meta.orient=e.target.value;save();renderRep()};$('pRep').onchange=e=>{meta.rep=e.target.checked;save();renderRep()};
$('pCols').onchange=()=>{meta.cols=[...document.querySelectorAll('#pCols input:checked')].map(i=>i.value);save();renderRep()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('pa').style.display==='block')closeRep()});
addEventListener('resize',()=>{if($('pa').style.display==='block'&&CUR)renderRep()});
/* ===== مركز التقارير ===== */
function reportsView(){const subs=[...new Set(data.filter(r=>r.cat==='معلم'&&r.subj).map(r=>r.subj))].sort((a,b)=>a.localeCompare(b,'ar')),pl=places(),sel=(id,arr,all)=>`<select id="${id}"><option value="">${all}</option>${arr.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
 $('v').innerHTML=`<div class="rc">
 <div class="panel"><h3>${ic('book')} معلمو مادة</h3><p>كشف بمعلمي مادة معينة، أو كل المواد مجمّعة (كل مادة في قسم مستقل بمسلسل خاص).</p><div><label>المادة</label>${sel('r1a',subs,'كل المواد (مجمّع)')}</div><div><label>المدرسة (اختياري)</label>${sel('r1b',pl,'كل المدارس')}</div><button class="btn" data-r="1">${ic('print')} معاينة وطباعة</button></div>
 <div class="panel"><h3>${ic('chart')} معلمو مرحلة</h3><p>معلمو المرحلة الابتدائية أو الإعدادية أو الثانوية… أو كل المراحل مجمّعة.</p><div><label>المرحلة</label>${sel('r2a',STAGES,'كل المراحل (مجمّع)')}</div><div><label>المادة (اختياري)</label>${sel('r2b',subs,'كل المواد')}</div><button class="btn" data-r="2">${ic('print')} معاينة وطباعة</button></div>
 <div class="panel"><h3>${ic('school')} معلمو مدرسة</h3><p>معلمو مدرسة محددة، أو كل المدارس مجمّعة حسب المدرسة.</p><div><label>المدرسة</label>${sel('r3a',pl,'كل المدارس (مجمّع)')}</div><button class="btn" data-r="3">${ic('print')} معاينة وطباعة</button></div>
 <div class="panel"><h3>${ic('users')} حسب الفئة الوظيفية</h3><p>الأخصائيون أو الإداريون أو العمال… لكل المدارس أو مدرسة محددة.</p><div><label>الفئة</label>${sel('r4a',CATS,'كل الفئات (مجمّع)')}</div><div><label>المدرسة (اختياري)</label>${sel('r4b',pl,'كل المدارس')}</div><button class="btn" data-r="4">${ic('print')} معاينة وطباعة</button></div>
 <div class="panel"><h3>${ic('file')} إحصائية المدارس</h3><p>جدول بعدد العاملين بكل مدرسة موزعين على الفئات، مع الإجمالي.</p><button class="btn" data-r="5">${ic('print')} معاينة وطباعة</button></div>
 <div class="panel"><h3>${ic('swap')} الموظفون المنتدبون</h3><p>كشف بالمنتدبين مجمّعين حسب جهة العمل.</p><button class="btn" data-r="6">${ic('print')} معاينة وطباعة</button></div>
 <div class="panel"><h3>${ic('user')} تقرير مخصص بالفلاتر</h3><p>من صفحة «العاملون» استخدم أي فلتر ثم «طباعة تقرير النتائج». ويمكن تغيير الأعمدة والاتجاه من شاشة المعاينة.</p><a class="btn o" href="#/">${ic('users')} الذهاب لصفحة العاملين</a></div></div>`;
 const T=()=>data.filter(r=>r.cat==='معلم'),by=(f)=>(a,b)=>f(a).localeCompare(f(b),'ar')||byName(a,b),g=id=>$(id)?$(id).value:'';
 document.querySelector('.rc').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;const k=b.dataset.r;let rs,t,s,gf;
  if(k==='1'){const v=g('r1a'),p=g('r1b');rs=T().filter(r=>(!v||r.subj===v)&&(!p||r.place===p));t='تقرير معلمي '+(v||'جميع المواد');s=[p&&'المدرسة: '+p].filter(Boolean).join('');rs.sort(v?by(r=>r.place):by(r=>'المادة: '+(r.subj||'غير محدد')));if(!v)gf=r=>'المادة: '+(r.subj||'غير محدد')}
  else if(k==='2'){const v=g('r2a'),m=g('r2b');rs=T().filter(r=>(!v||r._s===v)&&(!m||r.subj===m));t='تقرير معلمي '+(v?'المرحلة '+v:'جميع المراحل');s=m?'المادة: '+m:'';rs.sort((a,b)=>STAGES.indexOf(a._s)-STAGES.indexOf(b._s)||a.place.localeCompare(b.place,'ar')||byName(a,b));if(!v)gf=r=>'المرحلة: '+r._s}
  else if(k==='3'){const v=g('r3a');rs=T().filter(r=>!v||r.place===v);t='تقرير معلمي '+(v?'مدرسة':'جميع المدارس');s=v;rs.sort(by(r=>r.place));if(!v)gf=r=>r.place}
  else if(k==='4'){const v=g('r4a'),p=g('r4b');rs=data.filter(r=>(!v||r.cat===v)&&(!p||r.place===p));t='تقرير '+(v?'العاملين — '+v:'جميع العاملين');s=p?'المدرسة: '+p:'';rs.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||byName(a,b));if(!v)gf=r=>'الفئة: '+r.cat}
  else if(k==='5'){openReport(schoolStatsReport(schoolRows().filter(x=>x.n)));return}
  else{rs=data.filter(r=>r.status==='منتدب').sort(by(r=>r.place));t='تقرير الموظفين المنتدبين';s='';gf=r=>r.place}
  openReport(tableReport(t,s,rs,gf))}}
/* ===== الإعدادات والنسخ الاحتياطي ===== */
function settingsView(){$('v').innerHTML=`<div class="grid">
 <div class="panel sec"><h3>الموقّعون على التقارير</h3><p style="color:var(--mut);margin-top:0">يظهر الاسمان أسفل خانتي التوقيع في كل تقرير.</p><label>اسم مسئول شئون العاملين / الموارد البشرية</label><input id="s_hr" value="${esc(meta.hr)}"><label style="margin-top:8px">اسم مدير عام الإدارة</label><input id="s_gm" value="${esc(meta.gm)}"><div style="margin-top:10px"><button class="btn" id="s_sv">حفظ</button></div></div>
 <div class="panel sec"><h3>النسخ الاحتياطي</h3><p style="color:var(--mut);margin-top:0">البيانات محفوظة داخل هذا المتصفح فقط؛ احتفظ بنسخة احتياطية بانتظام.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bExp">${ic('dl')} نسخة احتياطية كاملة (بالمرفقات)</button><button class="btn o" id="bImp">${ic('ul')} استيراد نسخة</button><button class="btn o" id="bCsvAll">${ic('dl')} تصدير الكل Excel</button></div></div>
 <div class="panel sec"><h3>المظهر والبيانات</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" id="bTh">${ic('moon')} تبديل الوضع الليلي / النهاري</button><button class="btn o d" id="bRst">${ic('trash')} مسح كل البيانات</button></div></div></div>`;
 $('s_sv').onclick=()=>{meta.hr=$('s_hr').value.trim();meta.gm=$('s_gm').value.trim();save();toast('تم الحفظ')};
 $('bExp').onclick=async()=>{$('bExp').disabled=true;const j=await exportJSON();$('bExp').disabled=false;dlBlob(j,'نسخة_احتياطية_نخل_'+new Date().toISOString().slice(0,10)+'.json')};
 $('bImp').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(f)f.text().then(importJSON).catch(()=>alert('ملف غير صالح.'))};i.click()};
 $('bCsvAll').onclick=()=>csv(data,'كل_العاملين_نخل');$('bTh').onclick=toggleTheme;
 $('bRst').onclick=()=>{if(confirm('سيتم مسح كل البيانات من هذا المتصفح. تأكد من أخذ نسخة احتياطية. متابعة؟')){data=SEED.map((r,i)=>({...r,id:i+1}));meta.stages={};meta.schools={};meta.extra=[];commit()}}}
const dlBlob=(t,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()};
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportJSON(){let fs=[];try{const all=await tx('readonly',s=>s.getAll());fs=await Promise.all(all.map(async f=>({emp:f.emp,name:f.name,type:f.type,size:f.size,date:f.date,data:await b2d(f.blob)})))}catch(e){}const m={...meta};return JSON.stringify({v:3,data,meta:m,files:fs})}
async function importJSON(t){const o=JSON.parse(t),d=Array.isArray(o)?o:o.data,fs=Array.isArray(o)?[]:(o.files||[]);if(!Array.isArray(d)||!d.every(x=>x.name&&x.id))throw 0;
 if(!confirm('سيتم استبدال كل البيانات الحالية بـ '+d.length+' سجل و '+fs.length+' ملف مرفق. متابعة؟'))return;
 data=d;if(o.meta)meta=Object.assign({stages:{},schools:{},extra:[],hr:'',gm:'',theme:'',cols:DEFCOLS,orient:'portrait',rep:false},o.meta);
 try{await tx('readwrite',s=>s.clear());for(const f of fs){const blob=await(await fetch(f.data)).blob();await fAdd({emp:f.emp,name:f.name,type:f.type,size:f.size,date:f.date,blob})}}catch(e){alert('تم استيراد البيانات لكن تعذر استيراد بعض المرفقات.')}
 commit()}
/* ===== المظهر والتنقل ===== */
function applyTheme(){if(meta.theme)document.documentElement.dataset.theme=meta.theme;else delete document.documentElement.dataset.theme}
function toggleTheme(){const dark=document.documentElement.dataset.theme==='dark'||(!meta.theme&&matchMedia('(prefers-color-scheme:dark)').matches);meta.theme=dark?'light':'dark';save();applyTheme()}
const NAV=[['','home','العاملون'],['schools','school','المدارس'],['reports','print','التقارير'],['settings','gear','الإعدادات والنسخ']];
function route(){const h=location.hash||'#/',a=h.split('/')[1]||'';$('nav').innerHTML=NAV.map(([k,i,l])=>`<a href="#/${k}" class="${(a===k||(k==='schools'&&a==='school')||(k===''&&a==='emp'))?'on':''}">${ic(i)} ${l}</a>`).join('')+`<span class="sp"></span><a href="javascript:toggleTheme()" title="تبديل المظهر">${ic('moon')}</a>`;
 if(a!=='emp'&&a!=='school'&&a!=='')SEL.clear();
 if(a==='emp')showEmp(+h.split('/')[2]);else if(a==='school')schoolView(decodeURIComponent(h.slice(9)));else if(a==='schools')schoolsView();else if(a==='reports')reportsView();else if(a==='settings')settingsView();else homeView();
 if(!route.k)scrollTo(0,0);route.k=0}
addEventListener('hashchange',()=>{SEL.clear();route()});
$('lg1').src=LOGO;applyTheme();prepAll();fillDL();route();
</script>
